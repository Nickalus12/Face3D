# Samsung Galaxy S25 Ultra Camera Profiles
# Reference specs for each rear lens

device:
  name: "Samsung Galaxy S25 Ultra"
  sensor_format: "1/1.3in"  # Main sensor
  video_modes:
    - resolution: [7680, 4320]  # 8K
      fps: 30
      codec: "HEVC"
    - resolution: [3840, 2160]  # 4K
      fps: [30, 60]
      codec: "HEVC"
    - resolution: [1920, 1080]  # FHD
      fps: [30, 60, 120, 240]
      codec: "HEVC"

lenses:
  ultrawide:
    focal_length_mm: 13.0
    equivalent_focal_length_mm: 13.0
    aperture: 2.2
    sensor_size_mm: [6.4, 4.8]  # Approximate
    fov_degrees: 120
    pixel_size_um: 1.0
    resolution: [4000, 3000]  # 12MP
    distortion_model: "OPENCV"
    exif_focal_range: [1.0, 2.0]  # Physical focal length range in EXIF

  wide:
    focal_length_mm: 6.3
    equivalent_focal_length_mm: 23.0
    aperture: 1.7
    sensor_size_mm: [9.6, 7.2]  # 1/1.3"
    fov_degrees: 85
    pixel_size_um: 1.22
    resolution: [8160, 6120]  # 200MP (binned to 12.5MP)
    distortion_model: "OPENCV"
    exif_focal_range: [6.0, 7.0]

  telephoto_3x:
    focal_length_mm: 16.0
    equivalent_focal_length_mm: 70.0
    aperture: 2.6
    sensor_size_mm: [5.6, 4.2]  # Approximate
    fov_degrees: 36
    pixel_size_um: 1.0
    resolution: [4000, 3000]  # 10MP
    distortion_model: "OPENCV"
    exif_focal_range: [15.0, 17.0]

  telephoto_5x:
    focal_length_mm: 24.0
    equivalent_focal_length_mm: 200.0
    aperture: 3.4
    sensor_size_mm: [5.6, 4.2]  # Approximate
    fov_degrees: 12
    pixel_size_um: 1.0
    resolution: [4000, 3000]  # 50MP (binned)
    distortion_model: "OPENCV"
    exif_focal_range: [23.0, 25.0]

# IMU specs
imu:
  accelerometer:
    range_g: 16
    sample_rate_hz: 500
  gyroscope:
    range_dps: 2000
    sample_rate_hz: 500

# Samsung LOG profile approximation
log_profile:
  name: "Samsung Expert RAW LOG"
  approximation: "slog3"  # Closest standard log curve
  # S-Log3 EOTF coefficients (from Sony spec, used as approximation)
  # For accurate results, calibrate with X-Rite ColorChecker
