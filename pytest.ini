[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers (also registered in conftest.py for --strict-markers)
markers =
    slow: marks tests as slow (>5s, deselect with '-m "not slow"')
    cuda: marks tests requiring CUDA GPU (auto-skipped without GPU)
    benchmark: marks benchmark tests (run with --benchmark-enable)
    integration: marks integration tests spanning multiple stages
    property_based: marks property-based / Hypothesis fuzzing tests
    regression: marks golden-file / snapshot regression tests

# Default options
# When pytest-benchmark is installed, add: --benchmark-disable
# to skip benchmarks by default, or --benchmark-enable to run them.
addopts =
    --strict-markers
    -ra

# Logging
log_cli = false
log_cli_level = WARNING
